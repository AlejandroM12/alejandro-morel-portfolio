services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      ADMIN_API_KEY: local-dev-key-change
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  portfolio-postgres:
